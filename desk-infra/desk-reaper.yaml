AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lambda that stops desk workstations past their auto-stop time and reconciles router infra idle/wake, triggered every 10 minutes

Resources:
  ReaperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: desk-reaper
      Description: Stops overdue workstations and reconciles router infra wake/sleep
      Runtime: python3.12
      CodeUri: reaper/
      Handler: handler.handler
      Timeout: 120
      MemorySize: 128
      Environment:
        Variables:
          DESK_DATA_BUCKET: !Sub "${DeskWebStackName}-data-${AWS::AccountId}"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:StopInstances
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudformation:DescribeStacks
                - cloudformation:CreateStack
                - cloudformation:UpdateStack
                - cloudformation:DeleteStack
              Resource: "*"
            - Effect: Allow
              Action:
                - autoscaling:DescribeAutoScalingGroups
              Resource: "*"
            - Effect: Allow
              Action:
                - elasticloadbalancing:DescribeTargetHealth
                - elasticloadbalancing:DescribeTargetGroups
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${DeskWebStackName}-data-${AWS::AccountId}"
                - !Sub "arn:${AWS::Partition}:s3:::${DeskWebStackName}-data-${AWS::AccountId}/*"
      Tags:
        desk:managed: "true"
      Events:
        ScheduleRule:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
            Description: Trigger desk-reaper every 10 minutes
            Enabled: true
    Metadata:
      BuildMethod: makefile

Parameters:
  DeskWebStackName:
    Type: String
    Default: desk-web
    Description: Web app stack name (for DESK_DATA_BUCKET and S3 template access)

Outputs:
  ReaperFunctionArn:
    Description: ARN of the desk-reaper Lambda function
    Value: !GetAtt ReaperFunction.Arn
