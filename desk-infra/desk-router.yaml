AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Managed desk router base — IAM, launch template, instance SG, ASG shell, and optional CloudFront
  for public web routes. Ephemeral ALB lives in desk-router-active.

Parameters:
  RouterAmiId:
    Type: String
    Description: AMI ID - use the latest router-ami-* at deploy time; redeploy this stack to pick a newer AMI.
  InstanceType:
    Type: String
    Default: t3.small
    Description: Burstable instance; default is enough for a small number of routes and users (override if needed).
  WebRouterBaseDomain:
    Type: String
    Default: ""
    Description: >-
      When set (e.g. desk.example.com), instance user-data reconfigures the web router to listen on 0.0.0.0:8780
      and sets DESK_WEB_ROUTER_BASE_DOMAIN for public {name}-{port} hostnames. Leave empty for local-only router.
  CloudFrontVpcOriginPrefixListId:
    Type: String
    Description: >-
      EC2 managed prefix list ID for CloudFront VPC origins (com.amazonaws.global.cloudfront.origin-facing.vpc).
      Required for the internal ALB security group. Look up with deploy.sh or the EC2 console.
  DeskWebAppStackName:
    Type: String
    Default: desk-web
    Description: >-
      Name of the SAM/web-app stack that defines the data bucket (DeskDataBucketName output).
      Must match the stack used for `sam deploy`; bucket name is {stack}-data-{account}.
  DeskVpcStackName:
    Type: String
    Default: desk
    Description: >-
      VPC stack name probed when resolving the data bucket (second candidate after DeskWebAppStackName).
  EnableWebRouterCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      When "true" and CustomDomainName is set, deploy CloudFront for *.CustomDomainName public web routes.
  CustomDomainName:
    Type: String
    Default: ""
    Description: Optional FQDN apex for public web routes (e.g. desk.example.com).
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN in us-east-1 for CustomDomainName wildcard SAN.
  Route53HostedZoneId:
    Type: String
    Default: ""
    Description: Optional public hosted zone ID for wildcard DNS when CloudFront is enabled.
  WafWebAclArn:
    Type: String
    Default: ""
    Description: Optional WAF WebACL ARN (from desk-web) attached to the web-router CloudFront distribution.
  ActiveAlbArn:
    Type: String
    Default: ""
    Description: ARN of the active internal ALB (from desk-router-active); empty when idle.
  ActiveAlbDnsName:
    Type: String
    Default: ""
    Description: DNS name of the active internal ALB; empty when idle.
  ActiveAlbHostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID of the active ALB; empty when idle.
  ActiveTargetGroupArn:
    Type: String
    Default: ""
    Description: Target group ARN from desk-router-active; empty when idle.
  RouterDesiredCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: Router ASG desired capacity (0 when idle, 1 when active).

Conditions:
  HasActiveAlb: !Not [!Equals [!Ref ActiveAlbArn, ""]]
  HasActiveTargetGroup: !Not [!Equals [!Ref ActiveTargetGroupArn, ""]]
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]
  DeployWebRouterCloudFront:
    !And
    - !Equals [!Ref EnableWebRouterCloudFront, "true"]
    - !Condition HasCustomDomain
  DeployWebRouterCloudFrontWithAlb:
    !And
    - !Condition DeployWebRouterCloudFront
    - !Condition HasActiveAlb
  HasRoute53HostedZone: !Not [!Equals [!Ref Route53HostedZoneId, ""]]
  DeployWebRouterDns:
    !And
    - !Condition DeployWebRouterCloudFrontWithAlb
    - !Condition HasRoute53HostedZone
  HasWaf: !Not [!Equals [!Ref WafWebAclArn, ""]]
  AttachWafToWebRouter: !And
    - !Condition DeployWebRouterCloudFrontWithAlb
    - !Condition HasWaf

Resources:
  RouterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: desk-router-sg
      GroupDescription: Desk managed router - no inbound; egress for SSM and NAT (no instance-to-instance access)
      VpcId: !ImportValue desk-VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Egress for SSM, NAT, package updates
      Tags:
        - Key: Name
          Value: desk-router-sg
        - Key: desk:managed
          Value: "true"

  RouterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: desk-router-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: desk:managed
          Value: "true"

  RouterDeskCliPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: desk-router-desk-cli
      Roles:
        - !Ref RouterRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeInstancesForResolve
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
            Resource: "*"
          - Sid: SsmDescribeForReadyCheck
            Effect: Allow
            Action:
              - ssm:DescribeInstanceInformation
            Resource: "*"
          - Sid: SsmPortForwardingSessions
            Effect: Allow
            Action:
              - ssm:StartSession
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSession"
          - Sid: SsmTerminateSession
            Effect: Allow
            Action:
              - ssm:TerminateSession
            Resource: "*"
          - Sid: CfnDescribeDeskDataStacks
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
            Resource:
              - !Sub
                - "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${WebStack}/*"
                - WebStack: !Ref DeskWebAppStackName
              - !Sub
                - "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${VpcStack}/*"
                - VpcStack: !Ref DeskVpcStackName
          - Sid: S3DeskDataBucketRead
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub
                - "arn:${AWS::Partition}:s3:::${Prefix}-data-${AWS::AccountId}"
                - Prefix: !Ref DeskWebAppStackName
              - !Sub
                - "arn:${AWS::Partition}:s3:::${Prefix}-data-${AWS::AccountId}/*"
                - Prefix: !Ref DeskWebAppStackName

  RouterInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: desk-router-profile
      Roles:
        - !Ref RouterRole

  RouterLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: desk-router-lt
      LaunchTemplateData:
        ImageId: !Ref RouterAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref RouterInstanceProfile
        SecurityGroupIds:
          - !Ref RouterSecurityGroup
        MetadataOptions:
          HttpTokens: optional
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            sudo -u ubuntu env XDG_RUNTIME_DIR=/run/user/1000 AWS_DEFAULT_REGION=${AWS::Region} bash -lc '
              export DESK_WEB_ROUTER_LISTEN=0.0.0.0:8780
              export DESK_WEB_ROUTER_BASE_DOMAIN=${WebRouterBaseDomain}
              desk web-router stop 2>/dev/null || true
              desk web-router start --on-boot
              desk route-sync stop 2>/dev/null || true
              desk route-sync start --on-boot --interval 10
            '
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: router
              - Key: Type
                Value: router
              - Key: desk:managed
                Value: "true"

  RouterAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: desk-router-asg
      VPCZoneIdentifier: !Split [",", !ImportValue desk-PrivateSubnetIds]
      LaunchTemplate:
        LaunchTemplateId: !Ref RouterLaunchTemplate
        Version: !GetAtt RouterLaunchTemplate.LatestVersionNumber
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: !Ref RouterDesiredCapacity
      HealthCheckType: !If [HasActiveTargetGroup, ELB, EC2]
      HealthCheckGracePeriod: 300
      TargetGroupARNs: !If
        - HasActiveTargetGroup
        - - !Ref ActiveTargetGroupArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: router
          PropagateAtLaunch: false
        - Key: desk:managed
          Value: "true"
          PropagateAtLaunch: false

  # ---- Public web routes CloudFront (optional; moved from desk-web) ----
  DeskWebRouterVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Condition: DeployWebRouterCloudFrontWithAlb
    Properties:
      VpcOriginEndpointConfig:
        Arn: !Ref ActiveAlbArn
        Name: !Sub "${AWS::StackName}-desk-web-router-vpc"
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  RouterSubdomainAuthFunction:
    Type: AWS::CloudFront::Function
    Condition: DeployWebRouterCloudFrontWithAlb
    Properties:
      Name: !Sub "${AWS::StackName}-router-subdomain-auth"
      AutoPublish: true
      FunctionCode: !Sub |
        function cookieJarHasAuth(jar) {
          if (!jar) return false;
          var t = jar.desk_token || jar["desk_token"];
          var g = jar.desk_web_gate || jar["desk_web_gate"];
          function present(entry) {
            if (!entry) return false;
            if (entry.value && entry.value.length > 0) return true;
            if (entry.multiValue) {
              for (var i = 0; i < entry.multiValue.length; i++) {
                if (entry.multiValue[i].value && entry.multiValue[i].value.length > 0) return true;
              }
            }
            return false;
          }
          return present(t) || present(g);
        }
        function handler(event) {
          var request = event.request;
          var hostHeader = request.headers.host;
          var host = hostHeader ? hostHeader.value : "";
          var colon = host.indexOf(":");
          if (colon >= 0) host = host.substring(0, colon);
          if (host.length > 0 && host.charAt(host.length - 1) === ".") {
            host = host.substring(0, host.length - 1);
          }
          var apex = "${CustomDomainName}";
          if (host.length > 0 && host !== apex && host.endsWith("." + apex)) {
            if (!cookieJarHasAuth(request.cookies)) {
              var uri = request.uri || "/";
              var qs = request.querystring;
              var qParts = [];
              if (qs) {
                for (var key in qs) {
                  if (!Object.prototype.hasOwnProperty.call(qs, key)) continue;
                  var entry = qs[key];
                  if (entry.multiValue) {
                    for (var qi = 0; qi < entry.multiValue.length; qi++) {
                      var mv = entry.multiValue[qi];
                      if (mv && mv.value) {
                        qParts.push(encodeURIComponent(key) + "=" + encodeURIComponent(mv.value));
                      }
                    }
                  } else if (entry.value) {
                    qParts.push(encodeURIComponent(key) + "=" + encodeURIComponent(entry.value));
                  }
                }
              }
              var q = qParts.length > 0 ? "?" + qParts.join("&") : "";
              var returnUrl = "https://" + host + uri + q;
              var bridge = "https://" + apex + "/session-bridge.html?return=" + encodeURIComponent(returnUrl);
              return {
                statusCode: 302,
                statusDescription: "Found",
                headers: { location: { value: bridge } }
              };
            }
          }
          return request;
        }
      FunctionConfig:
        Comment: Require desk_token or desk_web_gate cookie on *.apex hostnames (public web routes)
        Runtime: cloudfront-js-2.0

  WebRouterCorsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: DeployWebRouterCloudFrontWithAlb
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web-router-cors"
        CorsConfig:
          AccessControlAllowCredentials: true
          AccessControlAllowHeaders:
            Items:
              - Accept
              - Content-Type
              - Origin
          AccessControlAllowMethods:
            Items: [GET, HEAD, OPTIONS]
          AccessControlAllowOrigins:
            Items:
              - !Sub "https://${CustomDomainName}"
          OriginOverride: true

  DeskWebRouterDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: DeployWebRouterCloudFrontWithAlb
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} public web routes (*.${CustomDomainName})"
        HttpVersion: http2and3
        Origins:
          - Id: DeskRouterAlbVpcOrigin
            DomainName: !Ref ActiveAlbDnsName
            VpcOriginConfig:
              VpcOriginId: !Ref DeskWebRouterVpcOrigin
        DefaultCacheBehavior:
          TargetOriginId: DeskRouterAlbVpcOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          ResponseHeadersPolicyId: !Ref WebRouterCorsResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterSubdomainAuthFunction.FunctionMetadata.FunctionARN
        Aliases:
          - !Sub "*.${CustomDomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        WebACLId: !If [AttachWafToWebRouter, !Ref WafWebAclArn, !Ref AWS::NoValue]

  WebRouterWildcardDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: DeployWebRouterDns
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: "*"
      Type: A
      AliasTarget:
        DNSName: !GetAtt DeskWebRouterDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  RouterAsgName:
    Description: Auto Scaling group name for the managed router
    Value: !Ref RouterAsg
  RouterSecurityGroupId:
    Description: Security group attached to router instances
    Value: !Ref RouterSecurityGroup
  RouterLaunchTemplateId:
    Description: Launch template for router instances
    Value: !Ref RouterLaunchTemplate
  WebRouterCloudFrontDomain:
    Condition: DeployWebRouterCloudFrontWithAlb
    Description: DNS target for wildcard public web routes (*.CustomDomainName)
    Value: !GetAtt DeskWebRouterDistribution.DomainName
  WebRouterCloudFrontURL:
    Condition: DeployWebRouterCloudFrontWithAlb
    Description: Example base URL for web routes (host is {name}-{port}.CustomDomainName)
    Value: !Sub "https://example.${CustomDomainName}/"
